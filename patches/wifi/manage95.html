<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>C208 设备管理</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f7f2;color:#183329;font:16px/1.6 system-ui,sans-serif}main{max-width:480px;margin:auto;padding:28px 20px}h1{font-size:28px}section{background:white;border:1px solid #dce7df;border-radius:18px;padding:20px;margin:18px 0}dl{margin:0}dt{font-size:13px;color:#61766c}dd{margin:2px 0 16px;overflow-wrap:anywhere}button{font:inherit;width:100%;border:0;border-radius:10px;padding:13px;background:#1d654b;color:white;min-height:48px}button:disabled{opacity:.55}p{color:#61766c;font-size:14px}#feedback{overflow-wrap:anywhere}[data-error=true]{color:#873d13}</style></head>
<body><main><h1>C208 设备管理</h1><p>手机与录音笔连接同一路由器，即可访问此页面。</p><section><dl><dt>连接状态</dt><dd id="status">正在读取…</dd><dt>当前 Wi-Fi</dt><dd id="ssid">—</dd><dt>设备 IP</dt><dd id="ip">—</dd><dt>电量</dt><dd id="battery">—</dd><dt>固件版本</dt><dd id="version">V0095</dd></dl><strong>By清风惹尘丶</strong></section>
<section><button id="provision" type="button">重新配置 Wi-Fi</button><p>确认后将断开路由器并开启 C208-Setup。请连接该热点，再打开 192.168.84.1 配网。</p><div id="feedback" role="status" aria-live="polite">设备已连接路由器，配网热点已关闭。</div></section></main>
<script>'use strict';const $=id=>document.getElementById(id);let busy=false;
async function refresh(){if(busy)return;try{const response=await fetch('/status',{cache:'no-store'});if(!response.ok)throw Error();const s=await response.json();$('status').textContent=s.connected?'已连接路由器 / 配网已关闭':s.status;$('ssid').textContent=s.ssid||'未知';$('ip').textContent=s.ip;$('battery').textContent=s.battery+'%';$('version').textContent=s.version;}catch(e){$('feedback').textContent='状态读取失败，请确认仍连接同一路由器，并检查设备屏幕上的 IP。';$('feedback').dataset.error='true';}}
$('provision').addEventListener('click',async()=>{if(busy||!confirm('设备将断开当前路由器，开启配网热点。继续吗？'))return;busy=true;$('provision').disabled=true;try{const response=await fetch('/provision',{method:'POST',headers:{'X-C208-Action':'provision','Content-Type':'application/x-www-form-urlencoded'},body:''});if(!response.ok)throw Error();$('feedback').dataset.error='false';$('feedback').textContent='已接收。请连接 C208-Setup，并打开 http://192.168.84.1/。';$('provision').textContent='请连接设备配网热点';}catch(e){$('feedback').textContent='未收到确认，请查看设备状态后重试。';$('feedback').dataset.error='true';busy=false;$('provision').disabled=false;}});
refresh();setInterval(refresh,5000);</script></body></html>
